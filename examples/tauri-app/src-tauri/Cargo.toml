[package]
name = "scriptca-tauri-example"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Example Rust host linking a scriptca native core (Tauri-ready command surface)"

[[bin]]
name = "scriptca-tauri-example"
path = "src/main.rs"

[dependencies]
scriptca-tauri = { path = "../../../crates/scriptca-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
