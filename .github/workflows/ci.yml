name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang g++
      - name: Ensure clang (macOS)
        if: runner.os == 'macOS'
        run: clang --version
      - name: Install zig (WASM toolchain)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            curl -fsSL https://ziglang.org/download/0.13.0/zig-macos-aarch64-0.13.0.tar.xz | tar -xJ
            echo "$PWD/zig-macos-aarch64-0.13.0" >> $GITHUB_PATH
          else
            curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ
            echo "$PWD/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH
          fi
      - run: bun install
      - run: bun run build
      # bin links are only created when dist/index.js exists — re-link after build
      - run: bun install
      - run: bun run --filter @scriptcable/core test
      - run: bun run --filter @scriptcable/cli test
      - run: bun run --filter @scriptcable/vite test
      - run: bun run --filter @scriptcable/next test
      - run: bun run --filter @scriptcable/webpack test
      - run: bun run --filter @scriptcable/react-native test
      - run: bun run --filter @scriptcable/node test
      - run: bun run --filter @scriptcable/tauri test
      - run: bun run --filter @scriptcable/lynx test
      - run: bun run --filter @scriptcable/example-calculator-core build
      - run: bun run --filter @scriptcable/example-bench-core build
      - run: bun run --filter @scriptcable/example-node-app test
      - name: Bun e2e
        run: bun run --filter @scriptcable/example-bun-app start
      - name: Vite + Next
        run: |
          bun run --filter @scriptcable/example-vite-app test:ssr
          bun run --filter @scriptcable/example-vite-app test:wasm
          bun run --filter @scriptcable/example-vite-app test:dropin
          bun run --filter @scriptcable/example-vite-app build
          bun run --filter @scriptcable/example-next-app test
      # Desktop / mobile-framework / web-framework host smokes — the Electron
      # binary downloads via its (trusted) postinstall; ubuntu runners ship
      # libnss3 and xvfb-run.
      - name: Electron (main native + renderer drop-in)
        if: runner.os == 'Linux'
        run: bun run --filter @scriptcable/example-electron-app test
      - name: Astro
        run: bun run --filter @scriptcable/example-astro-app test
      - name: SvelteKit
        run: bun run --filter @scriptcable/example-sveltekit-app test
      - name: Expo metro bundle
        run: bun run --filter @scriptcable/example-react-native-app test:expo
      - name: Android native host (cross-build + dispatch smoke)
        run: bun run --filter @scriptcable/example-react-native-app test:android
      - name: Nuxt
        run: bun run --filter @scriptcable/example-nuxt-app test
      - name: React Router
        run: bun run --filter @scriptcable/example-remix-app test
      - name: SolidStart
        run: bun run --filter @scriptcable/example-solidstart-app test
      - name: Cloudflare Workers (dry-run + wrangler dev)
        run: bun run --filter @scriptcable/example-workers-app test
      - name: Install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno runtime
        run: bun run --filter @scriptcable/example-deno-app test
      - run: bun run --filter @scriptcable/example-calculator-core contract:check
      - run: bun run --filter @scriptcable/example-calculator-core build:wasm
      # Non-blocking while runner numbers accumulate — the ×2.5 tolerance
      # catches gross call-path regressions, not runner jitter
      - name: Perf gate (vs committed baseline)
        run: bun examples/bench-core/scripts/bench-gate.ts
        continue-on-error: true
      # Node(V8) string-tier measurement — the local dev environment has no
      # node, so this record lives here. Measurement only: runner numbers
      # don't gate (same tolerance caveat as bench-gate above).
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: Node runtime string measurement
        if: runner.os == 'Linux'
        run: |
          node examples/bench-core/scripts/bench-node.ts --out bench-node.json | tee bench-node.txt
          {
            echo "### Node string tiers"
            echo '```'
            cat bench-node.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: bench-node-${{ matrix.os }}
          path: bench-node.json

  # Windows: scriptc compiles, zig cc links, watch/init/tests pass. The
  # typed N-API addon doesn't build on Windows yet (FFI fallback serves
  # those hosts).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # clang targets x86_64-pc-windows-msvc on these runners — without the
      # MSVC dev environment (INCLUDE/LIB/link.exe) the link stage fails with
      # an opaque scriptc error
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Toolchain inventory
        run: |
          clang --version || echo "clang: MISSING"
      - name: Install zig (WASM toolchain — and the linker driver on Windows)
        shell: bash
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip -o zig.zip
          unzip -q zig.zip -d "$GITHUB_WORKSPACE"
          # $PWD here is a Git-Bash POSIX path (/d/a/...) which Windows
          # processes cannot resolve — write the Windows form. (The entry
          # lands on PATH for SUBSEQUENT steps only.)
          echo "$GITHUB_WORKSPACE/zig-windows-x86_64-0.13.0" >> "$GITHUB_PATH"
      - run: bun install
      - run: bun run build
      - run: bun install
      - run: bun run --filter @scriptcable/core test
      - run: bun run --filter @scriptcable/cli test
      - run: bun run --filter @scriptcable/example-calculator-core build
