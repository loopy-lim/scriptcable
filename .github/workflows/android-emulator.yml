name: android-emulator

# STRUCTURALLY BLOCKED — job is skipped until upstream unblocks one of the
# three paths. Everything below was VERIFIED IN CI on 2026-11-07 (runs
# 42385981695..42397559190), not guessed:
#
# 1. arm64 runner (ubuntu-24.04-arm): Google ships no Linux arm64 emulator
#    BINARY — sdkmanager can't even see the `emulator` package ("Failed to
#    find package"). ARM64 host support exists as SOURCE ONLY since 2020
#    (emulator release notes 30.0.26) — an AOSP emu-master-dev repo sync +
#    cross-compile, far outside CI budgets. (The old ubuntu-24.04-arm
#    design died here.)
# 2. x86_64 runner + ARM translation (API 30 google_apis;x86_64): the image
#    IS bootable with KVM (chmod 666 /dev/kvm; `-accel auto`) and the
#    arm64-only APK installs (abilist = x86_64,x86,arm64-v8a,...) — but the
#    image's libndk translation INTERPRETER doesn't cover the NEON
#    instructions Hermes arm64 emits: the release APK dies with
#    `Fatal signal 4 (SIGILL) in mqt_v_js`,
#    backtrace `libndk_translation.so DecodeSimdScalarTwoRegMisc`; the
#    debug APK hangs before React init (no js/mqt_js threads ever appear).
#    arm64-on-x86_64 translation cannot run RN+Hermes apps. (This path was
#    fully built out below before being blocked — see git log.)
# 3. x86_64 runner + x86_64 artifacts: scriptc publishes precompiled
#    runtime packs per target (@scriptc/runtime-android-arm64 etc.) and
#    scriptc rejects a target without a matching pack (SC3003 family).
#    There is NO @scriptc/runtime-android-x86_64 on npm, and the packs are
#    precompiled .o/.a — not reproducible from @scriptc/runtime sources
#    without upstream tooling.
#
# RE-ENABLE when vercel-labs/scriptc ships @scriptc/runtime-android-x86_64:
#   - build: scriptca build --platform android --abi x86_64 (core needs
#     the abi plumbed through toolchain.ts platform + ensureRuntimePack)
#   - expo plugin: jniLibs/x86_64 copy
#   - below: image system-images;android-30;google_apis;x86_64 (native
#     x86_64, no translation), APK with -PreactNativeArchitectures=x86_64,
#     everything else (KVM chmod, metro virtual-entry warm, boot, assert)
#     already proven working by the blocked arm64 attempt.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  emulator:
    if: false # structurally blocked — see the header for the three paths
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Bootstrap cmdline-tools (the zip is arch-independent Java) — do NOT
      # rely on the runner's preinstalled SDK layout.
      - name: Android SDK (bootstrap + emulator x86_64 w/ arm64 translation)
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          # Pin the CURRENT cmdline-tools: the 2024 build (11076708) only
          # parses SDK repository XML up to v3 and silently failed to write
          # the AVD against today's v4 repo.
          curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-30;google_apis;x86_64"
          # New cmdline-tools default AVD home to the XDG path
          # (~/.config/.android/avd) while the emulator binary still defaults
          # to ~/.android/avd — pin BOTH to one explicit location.
          mkdir -p "$HOME/android-avd"
          echo "ANDROID_AVD_HOME=$HOME/android-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$HOME/android-avd" >> "$GITHUB_ENV"
          # Later steps call adb/avdmanager/emulator bare — register the SDK
          # bin dirs on PATH for them.
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          df -h "$HOME" | tail -1
      - uses: oven-sh/setup-bun@v2
      - name: zig 0.13 (wasm + android cross-link)
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
      - run: bun install
      - run: bun run build
      - name: Build core + android artifacts + dispatch smoke
        run: bun run --filter @scriptca/example-react-native-app test:android
      - name: App bundle smoke (launchability — real metro graph)
        run: bun run --filter @scriptca/example-react-native-app test:app-bundle
      - name: Serve JS bundle (expo metro — warm it before the app asks)
        run: |
          cd examples/react-native-app
          # --no-open doesn't exist in expo 58's CLI; CI=1 already keeps it
          # non-interactive, and --host localhost skips LAN interface probing.
          EXPO_NO_TELEMETRY=1 CI=1 bunx expo start --port 8081 --host localhost &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8081/status 2>/dev/null | grep -q packager-status:running && break
            sleep 2
          done
          curl -fsS http://localhost:8081/status | grep -q packager-status:running \
            || { echo "metro never came up"; exit 1; }
          # Force the graph compile NOW so the on-device fetch hits a warm
          # server (cold RN graph + 60s-class fetch timeouts don't mix). The
          # URL must be expo's virtual entry — the prebuilt debug app fetches
          # it (ExpoReactHostFactory defaults jsMainModulePath to
          # ".expo/.virtual-metro-entry"), and /index.bundle 404s on expo's
          # metro.
          curl -fsS -m 900 -o /tmp/warm.bundle \
            "http://localhost:8081/.expo/.virtual-metro-entry.bundle?platform=android&dev=true&lazy=true"
          wc -c /tmp/warm.bundle
      - name: Assemble APK (arm64-only — the translation image accepts it)
        working-directory: examples/react-native-app
        run: |
          bunx expo prebuild -p android --no-install
          cd android && ./gradlew assembleDebug assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Boot emulator (API 30 google_apis x86_64 — arm64 via translation)
        run: |
          echo no | avdmanager create avd -n cable -k "system-images;android-30;google_apis;x86_64" -d pixel_5
          # Fail fast (with diagnostics) if the AVD didn't land where the
          # emulator looks — a missing AVD otherwise shows up only as a
          # 10-minute wait-for-device hang.
          if [ ! -f "$ANDROID_AVD_HOME/cable.ini" ]; then
            echo "cable.ini missing after avdmanager — AVD listing follows:"
            avdmanager list avd 2>&1 || true
            ls -la "$ANDROID_AVD_HOME" 2>&1 || true
            exit 1
          fi
          # Hosted x64 runners expose /dev/kvm (nested virtualization) but the
          # runner user isn't in the kvm group — grant rw so the emulator can
          # use it (x86_64 guests have NO software-emulation fallback).
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          "$ANDROID_HOME/emulator/emulator" -avd cable -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -no-metrics -accel auto &
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 300 "$ADB" wait-for-device
          for i in $(seq 1 90); do
            BOOTED=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOTED" = "1" ] && break
            sleep 10
          done
          [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] \
            || { echo "emulator never finished booting"; "$ADB" logcat -d | tail -100; exit 1; }
          # Translation sanity: the image must expose arm64-v8a or the
          # arm64-only APK can never install.
          "$ADB" shell getprop ro.product.cpu.abilist
      - name: Install + run bridge call
        working-directory: examples/react-native-app
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" reverse tcp:8081 tcp:8081
          assert_result () {
            for i in $(seq 1 "$2"); do
              HIT=$("$ADB" logcat -d -s ReactNativeJS:* 2>/dev/null | grep "CABLE_RESULT" | tail -1)
              [ -n "$HIT" ] && break
              sleep 10
            done
            if [ -n "$HIT" ]; then
              echo "$HIT"
              echo "$HIT" | grep -q 'CABLE_RESULT:{"sum":42}' \
                && echo "$3 OK" && return 0
              echo "$3 gave a CABLE_RESULT but not the 42"; return 1
            fi
            return 1
          }
          # --- Primary: debug APK (JS from metro over adb reverse) ---
          "$ADB" install -r android/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" logcat -c
          "$ADB" shell monkey -p com.scriptca.rnexample 1
          sleep 120
          "$ADB" exec-out screencap -p > /tmp/debug-hang.png 2>/dev/null || true
          if assert_result "" 30 "debug APK"; then exit 0; fi
          echo "debug APK silent after 7 min — JS never produced a log."
          echo "--- app threads (missing js/mqt_js = React never initialized):"
          "$ADB" shell ps -T "$("$ADB" shell pidof com.scriptca.rnexample | tr -d '\r')" 2>/dev/null | head -60 || true
          echo "--- focused window:"
          "$ADB" shell dumpsys window 2>/dev/null | grep -m1 mCurrentFocus || true
          # --- Fallback: release APK (bundle baked in — no dev server at all;
          # --- RN template ships minify disabled, so JNI symbols stay intact).
          echo "--- falling back to release APK (embedded bundle, no metro)"
          "$ADB" uninstall com.scriptca.rnexample >/dev/null 2>&1 || true
          "$ADB" install -r android/app/build/outputs/apk/release/app-release.apk
          "$ADB" logcat -c
          "$ADB" shell monkey -p com.scriptca.rnexample 1
          sleep 60
          "$ADB" exec-out screencap -p > /tmp/release-hang.png 2>/dev/null || true
          if assert_result "" 60 "release APK"; then
            echo "NOTE: debug path hung but release works — investigate dev-server load on this image"
            exit 0
          fi
          echo "release APK silent too — diagnostics:"
          echo "--- app process (empty = died/never started):"
          "$ADB" shell pidof com.scriptca.rnexample || true
          echo "--- focused window:"
          "$ADB" shell dumpsys window 2>/dev/null | grep -m1 mCurrentFocus || true
          echo "--- ReactNativeJS + AndroidRuntime:"
          "$ADB" logcat -d -s ReactNativeJS:* AndroidRuntime:E | tail -100
          echo "--- crash signals (DEBUG/libc):"
          "$ADB" logcat -d -s DEBUG:* libc:* | tail -50
          echo "--- raw logcat tail (all tags):"
          "$ADB" logcat -d | tail -300
          exit 1
      - name: Upload device screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-screenshots
          path: /tmp/*-hang.png
          if-no-files-found: ignore
