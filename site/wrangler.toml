# Cloudflare Pages project for the scriptcable intro site.
# Deploy: `.github/workflows/site.yml` (wrangler-action) — needs the
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets.
# Custom domain (scriptca.ll3.kr) is bound in the Pages dashboard:
# project → Custom domains → Set up a custom domain.
name = "scriptcable"
compatibility_date = "2026-11-13"
pages_build_output_dir = "dist"
